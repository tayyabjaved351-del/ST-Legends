<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ST Legends Shots</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  color:#fff;
  background:
    radial-gradient(circle at 15% 5%,rgba(166,40,255,.35),transparent 30%),
    radial-gradient(circle at 90% 25%,rgba(0,174,255,.22),transparent 28%),
    radial-gradient(circle at 50% 100%,rgba(255,0,153,.18),transparent 35%),
    #05050b;
}

.header{
  max-width:900px;
  margin:auto;
  padding:18px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-icon{
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:13px;
  background:linear-gradient(135deg,#ff00cc,#635bff,#00cfff);
  box-shadow:0 8px 30px rgba(117,70,255,.35);
  font-size:21px;
}

.brand-text{
  font-size:17px;
  font-weight:800;
}

.pro{
  padding:8px 14px;
  border-radius:30px;
  font-size:11px;
  font-weight:800;
  letter-spacing:1px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);
}

.hero{
  max-width:760px;
  margin:auto;
  text-align:center;
  padding:65px 20px 35px;
}

.badge{
  display:inline-block;
  padding:8px 14px;
  border-radius:30px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  color:#cfcfff;
  font-size:11px;
  margin-bottom:18px;
}

.hero h1{
  font-size:clamp(42px,9vw,72px);
  line-height:.98;
  letter-spacing:-3px;
  font-weight:900;
  background:linear-gradient(90deg,#ff4bd8,#8b6cff,#25dfff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.hero h2{
  margin-top:18px;
  font-size:20px;
  color:#fff;
}

.hero p{
  max-width:560px;
  margin:15px auto 0;
  color:#9999ad;
  font-size:14px;
  line-height:1.7;
}

.container{
  width:min(900px,100%);
  margin:auto;
  padding:15px;
}

.cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.card{
  position:relative;
  overflow:hidden;
  min-height:260px;
  padding:25px;
  border-radius:25px;
  background:linear-gradient(
    145deg,
    rgba(255,255,255,.105),
    rgba(255,255,255,.035)
  );
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 18px 50px rgba(0,0,0,.28);
  backdrop-filter:blur(18px);
}

.card:before{
  content:"";
  position:absolute;
  width:130px;
  height:130px;
  border-radius:50%;
  background:rgba(116,76,255,.15);
  filter:blur(30px);
  right:-50px;
  top:-50px;
}

.card.full{
  grid-column:1 / -1;
  min-height:220px;
}

.icon{
  width:55px;
  height:55px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:17px;
  background:linear-gradient(135deg,#ff00cc,#655bff);
  font-size:27px;
  margin-bottom:25px;
  box-shadow:0 10px 30px rgba(105,70,255,.3);
}

.card h3{
  font-size:22px;
  margin-bottom:9px;
}

.card p{
  color:#9999ad;
  font-size:13px;
  line-height:1.6;
  min-height:42px;
}

.input,
.textarea{
  width:100%;
  border:1px solid rgba(255,255,255,.12);
  outline:none;
  border-radius:13px;
  padding:14px;
  margin-top:16px;
  background:rgba(0,0,0,.3);
  color:#fff;
  font-size:13px;
}

.textarea{
  min-height:120px;
  resize:vertical;
}

.input::placeholder,
.textarea::placeholder{
  color:#77778b;
}

.button{
  width:100%;
  border:0;
  padding:14px;
  margin-top:10px;
  border-radius:13px;
  color:#fff;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
  background:linear-gradient(135deg,#ff00cc,#655bff,#009dff);
  box-shadow:0 10px 25px rgba(93,74,255,.22);
}

.button:active{
  transform:scale(.98);
}

.message{
  color:#a8a8
