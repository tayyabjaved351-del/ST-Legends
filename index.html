<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ST Legends Shots</title>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 10%,#7028c8 0%,transparent 30%),
    radial-gradient(circle at 90% 80%,#006eff 0%,transparent 35%),
    #070712;
  color:white;
}

.header{
  padding:18px 15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(255,255,255,.1);
}

.logo{
  font-size:20px;
  font-weight:800;
}

.pro{
  background:linear-gradient(135deg,#ff00cc,#4c4cff);
  padding:8px 14px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.container{
  max-width:720px;
  margin:auto;
  padding:20px 15px 40px;
}

.hero{
  text-align:center;
  padding:25px 10px;
}

.hero h1{
  font-size:34px;
  background:linear-gradient(90deg,#ff42d0,#7d62ff,#20dfff);
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  color:#aaaabd;
  margin-top:10px;
  line-height:1.5;
}

.editor{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  border-radius:24px;
  padding:18px;
  backdrop-filter:blur(12px);
}

.upload{
  border:2px dashed #6464ff;
  border-radius:18px;
  padding:28px 15px;
  text-align:center;
  cursor:pointer;
  background:rgba(90,80,255,.08);
}

.upload strong{
  display:block;
  font-size:18px;
  margin-bottom:8px;
}

.upload span{
  color:#aaaabd;
  font-size:13px;
}

#videoInput{
  display:none;
}

.video-box{
  margin-top:18px;
  background:#000;
  border-radius:18px;
  overflow:hidden;
  display:none;
}

video{
  width:100%;
  max-height:500px;
  display:block;
  object-fit:contain;
}

.controls{
  display:none;
  margin-top:15px;
}

.row{
  display:flex;
  gap:8px;
  margin-top:10px;
  flex-wrap:wrap;
}
